<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f5f5f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1d1f">
<meta name="description" content="Collaborative Typst editor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Typst Editor">
<meta property="og:description" content="Collaborative Typst editor">
<meta property="og:type" content="website">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Typst Editor</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--line:rgba(0,0,0,.08);--text:#1d1d1f;--sub:#6e6e73;--acc:#0071e3;--sel:rgba(0,113,227,.12)}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{transition:background-color .15s ease}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#login{max-width:300px;margin:14vh auto;display:flex;flex-direction:column;gap:10px;background:var(--card);padding:28px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
#login h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.02em}
#login input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#f5f5f7}
#login button{padding:9px;background:var(--acc);color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:600}
#login .mode{text-align:center;font-size:13px;color:var(--acc);cursor:pointer}
#app{display:none;height:100vh}
#app.on{display:flex}
aside{width:232px;box-sizing:border-box;background:rgba(242,242,247,.9);padding:12px;overflow:hidden;border-right:1px solid var(--line);flex:none;display:flex;flex-direction:column;transition:width .25s ease,padding .25s ease}
#nav{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none} /* Mitte scrollt (Mausrad), ohne Balken */
#nav::-webkit-scrollbar{display:none} /* Chrome/Edge: Balken weg, scrollt trotzdem */
#userBox{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:13px}
#userBox #who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600;cursor:pointer}
#userBox #who:hover{color:var(--acc)}
#userBox button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--sub)}
aside h3{margin:14px 0 4px;padding:3px 4px;border-radius:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);display:flex;align-items:center;gap:2px;cursor:pointer}
aside h3:hover,aside .fhd:hover{background:rgba(0,0,0,.05)}
aside h3 .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside h3:hover .mini{visibility:visible}
aside .doc{display:flex;align-items:center;gap:2px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
aside .doc .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* Text kürzt, Buttons bleiben sichtbar */
aside .doc .mini{flex:none}
aside .doc:hover{background:rgba(0,0,0,.05)}
aside .doc.cur{background:var(--sel);font-weight:600}
aside .fhd{display:flex;gap:2px;align-items:center;margin:12px 4px 2px 10px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)} /* Ordner: eingerückt, leichter als Sektion (b wäre sonst bolder) */
aside .fhd b{flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
aside .doc.sub{margin-left:20px} /* Doc im Ordner/Gruppe: weiter eingerückt */
aside .mini{visibility:hidden;background:none;border:0;cursor:pointer;color:var(--sub);padding:1px 3px;font-size:12px;border-radius:6px;min-width:22px;min-height:22px;display:inline-flex;align-items:center;justify-content:center} /* 22px: Touch-Fehlklicks weg, Desktop gleich schlank */
aside .doc:hover .mini,aside .fhd:hover .mini{visibility:visible} /* visibility statt display: Zeile springt nicht */
@media (hover:none){aside .mini{visibility:visible}} /* Touch: kein Hover, Buttons immer da */
aside .mini:hover{background:rgba(0,0,0,.06);color:var(--text)}
aside .row button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer;font-weight:600;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;gap:8px;align-items:center;padding:0 12px;height:48px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);position:relative;z-index:30}
header button{background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--text);font-size:15px}
header button:hover{background:rgba(0,0,0,.06)}
#title{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#role{font-size:11px;background:var(--sel);color:var(--acc);border-radius:20px;padding:2px 9px;font-weight:600}
#save{font-size:12px;color:var(--sub)}
#peers{display:flex;gap:4px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#userBox .dot{width:18px;height:18px} /* Account-Bild: etwas größer */
#peers .dot{width:18px;height:18px} /* aktiv oben: so groß wie unten */
header .grp{display:flex;gap:2px;align-items:center;color:var(--sub);font-size:12.5px}
#tools{display:flex;gap:2px;padding:6px 10px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);position:relative;z-index:20;align-items:center}
#tools button{background:none;border:0;border-radius:8px;min-width:30px;height:28px;padding:4px 8px;cursor:pointer;color:#3a3a3c;box-shadow:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
#tools button:hover{background:rgba(0,0,0,.06)}
#tools .grp{display:flex;gap:2px;align-items:center;margin-left:auto;color:var(--sub);font-size:12.5px}
#tools .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 6px}
#tools button svg,header button svg,#pop button svg{display:block}
#media{display:flex;gap:8px;padding:8px 12px;background:rgba(255,255,255,.8);border-bottom:1px solid var(--line);align-items:center;overflow-x:auto;font-size:13px}
#media .chip{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.04)}
#media .chip b{cursor:pointer;font-weight:600;font-size:12.5px}
#media .chip b:hover{color:var(--acc)}
#media .chip .sz{color:var(--sub);font-size:12px}
#media button{background:#f5f5f7;border:0;border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap;font-size:12.5px}
#media .chip button{padding:0 6px;color:var(--sub)}
#mid{flex:1;display:flex;min-height:0}
#leftCol{width:50%;display:flex;flex-direction:column;min-width:0;min-height:0}
#rightCol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#pvTools{display:flex;gap:2px;padding:6px 10px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);align-items:center;justify-content:flex-end}
#pvTools button{background:none;border:0;border-radius:8px;min-width:30px;height:28px;padding:4px 8px;cursor:pointer;color:#3a3a3c;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
#pvTools button:hover{background:rgba(0,0,0,.06)}
#pvTools button.on{color:var(--acc);font-weight:700}
#pvTools .grp{display:flex;gap:2px;align-items:center;color:var(--sub);font-size:12.5px}
#editWrap{flex:1;display:flex;position:relative;background:var(--card);min-width:0;min-height:0}
#cmWrap .cm-gutters{background:var(--card);border:0;color:#aeaeb2}
#cmWrap .cm-lineNumbers .cm-gutterElement{padding:0 8px 0 2px;font-size:calc(var(--ed) - 1px);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#cmWrap .cm-lineNumbers .cm-gutterElement.hasThread{color:var(--acc);font-weight:700;cursor:pointer}
#cmWrap{flex:1;min-width:0;position:relative;background:var(--card);--ed:14px;--lh:21px;padding:0 12px;box-sizing:border-box}
#cm{height:100%;overflow:hidden}
#cm .cm-editor{height:100%}
#cmWrap .cm-content{font:var(--ed)/var(--lh) ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);caret-color:var(--acc)}
#cmWrap .cm-cursor{border-left-color:var(--acc)}
#cmWrap .cm-selectionBackground{background:rgba(0,113,227,.15)}
#cmWrap .cm-tooltip{border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);overflow:hidden;background:var(--card)}
#cmWrap .cm-tooltip-autocomplete ul li[aria-selected]{background:var(--acc);color:#fff}
.typ-hover{max-width:280px;padding:8px 11px;font:12.5px/1.5 -apple-system,system-ui,sans-serif;color:var(--text);white-space:pre-line}
.typ-hover.err{background:rgba(215,0,21,.07);border-left:3px solid rgba(215,0,21,.6)} /* Fehler-Box: bisschen Rot */
.typ-hover.full{max-width:320px}
.typ-hover b{font-weight:700}
#cmWrap .cm-line{padding:0 2px} /* 2px seitlich: Cursor an Pos 0 bleibt sichtbar (sonst im Overflow geclippt) */
#cmWrap .cm-activeLine{background:rgba(0,0,0,.03)}
.peer{display:inline-block;width:0;height:1.2em;margin-left:-1px;vertical-align:text-top;border-left:3px solid #ff5f57;cursor:default}
.peerName{font:600 11px/1.5 -apple-system,system-ui,sans-serif;background:#fff;border:1px solid;border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15);vertical-align:text-top;cursor:default}
#preview{flex:1;min-width:0;overflow:auto;padding:16px;background:#e8e8ed}
#split{flex:none;width:11px;cursor:col-resize;position:relative;touch-action:none}
#split::after{content:'';position:absolute;top:0;bottom:0;left:5px;width:1px;background:rgba(0,0,0,.12)}
#split:hover::after,#split.drag::after{background:var(--acc);left:4px;width:3px;border-radius:2px}
#sideSplit{flex:none;width:11px;cursor:col-resize;position:relative;touch-action:none}
#sideSplit::after{content:'';position:absolute;top:0;bottom:0;left:5px;width:1px;background:rgba(0,0,0,.12)}
#sideSplit:hover::after,#sideSplit.drag::after{background:var(--acc);left:4px;width:3px;border-radius:2px}
body.sideDrag aside{transition:none}
body.noside aside{width:0!important;padding-left:0;padding-right:0;border-right:0;overflow:hidden}
body.noside #sideSplit{display:none}
#vsplit{display:none} /* nur Handy: Höhe ziehen (s. Media-Query) */
body.read #leftCol,body.read #split{display:none} /* Sidebar bleibt: Docs wechselbar, per ☰ klemmbar */
body.read #syncBtn,body.editonly #syncBtn{display:none} /* Sync nur wenn beide da sind */
body.read #preview{padding:28px 16px}
body.read #preview canvas{max-width:820px;margin:0 auto 16px}
#preview canvas{display:block;background:#fff;width:100%;height:auto;margin:0 auto 24px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.12);border-radius:6px}
#preview .empty{max-width:420px;margin:15vh auto;text-align:center;color:var(--sub);font-size:14px}
#sharePop{position:absolute;top:calc(100% + 6px);left:8px;width:320px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:12px;z-index:30;font-size:14px}
#sharePop .sTop{display:flex;align-items:center;margin-bottom:8px}
#sharePop .sTop b{flex:1;font-size:13px}
#sharePop .sTop button{background:none;border:0;cursor:pointer;font-size:13px;padding:4px;color:var(--sub)}
#sharePop .row button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600}
#sharePop #shares{margin-top:8px;display:flex;flex-direction:column;gap:4px}
#sharePop #shares .who{font-size:12.5px;color:var(--text)}
#sharePop #shares button{background:#f5f5f7;border:0;border-radius:6px;padding:2px 8px;cursor:pointer}
.row{display:flex;gap:6px;margin-top:6px}
.row input,.row select{flex:1;min-width:0;background:#f5f5f7;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.row button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600}
#pop{position:absolute;left:60px;width:320px;max-height:70%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.2);z-index:5;font-size:13.5px}
#pop .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--sub)}
#pop .bar .ib{border-radius:50%;width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center}
#pop .th{padding:12px 14px;border-bottom:1px solid var(--line)}
#pop .hd{display:flex;gap:6px;align-items:baseline}
#pop .nm{font-weight:700;font-size:13px}
#pop .tm{font-size:11.5px;color:var(--sub)}
#pop .tx{margin:3px 0 0;overflow-wrap:anywhere}
#pop .qt{margin:6px 0 0;font-size:12px;color:var(--sub);cursor:pointer;overflow-wrap:anywhere;background:#f5f5f7;border-radius:8px;padding:6px 10px}
#cmWrap .cm-hl{background:rgba(255,204,0,.28);border-radius:3px}
#cmWrap .cm-hl:hover{background:rgba(255,204,0,.45);cursor:pointer}
#cmWrap .cm-find{background:rgba(0,113,227,.25);border-radius:3px}
#cmWrap .cm-find-cur{background:rgba(255,149,0,.55);border-radius:3px}
#cmWrap .cm-err{position:relative;background:rgba(215,0,21,.13)}
#cmWrap .cm-err::after{content:'';position:absolute;left:100%;top:0;bottom:0;width:100vw;background:rgba(215,0,21,.13)} /* Rest der Zeile rot: abspos malt mit, misst nichts (kein Block, keine Extra-Zeile) */
.cm-tooltip-lint{display:none} /* eine Meldung: der Zeilen-Hover zeigt den Lint-Text auf der ganzen Zeile */
#find{display:flex;gap:6px;align-items:center;padding:6px 10px;background:rgba(255,255,255,.9);border-top:1px solid var(--line);font-size:13px}
#find input{background:#f5f5f7;border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:120px}
#find .n{color:var(--sub);min-width:44px;text-align:center}
#find button{background:#f5f5f7;border:0;border-radius:8px;padding:5px 9px;cursor:pointer}
#find button.on{background:var(--sel);color:var(--acc);font-weight:700}
#find .x{margin-left:auto}
#pop .rp{margin:8px 0 0;padding:10px 12px;background:#f5f5f7;border-radius:10px}
#pop .rr{display:flex;gap:8px;margin-top:8px}
#pop .rr input{flex:1;min-width:0;background:#f5f5f7;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
#pop .rr input:focus{border-color:var(--acc);outline:none}
#pop .rr .ib{background:var(--acc);color:#fff;border-radius:10px;padding:8px 12px} /* Senden: blau statt grau */
#pop .ib{background:rgba(0,0,0,.05);border:0;cursor:pointer;font-size:13px;padding:5px 9px;border-radius:7px}
#pop .nw{padding:12px 14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100}
#mCard{width:min(360px,92vw);background:var(--card);border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.pk{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#f5f5f7;cursor:pointer;text-align:left}
.pk:hover{border-color:var(--acc);background:var(--sel)}
.pk b{display:block;font-size:14px}
.pk span{display:block;font-size:12.5px;color:var(--sub);font-weight:400;margin-top:2px}
#mCard b{font-size:15px;letter-spacing:-.01em}
#mInp{width:100%;box-sizing:border-box;margin:12px 0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#f5f5f7}
#setPop .serr{background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px}
.mRow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mRow button{border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
#mNo{background:#f5f5f7;color:var(--text)}
#mYes{background:var(--acc);color:#fff}
#setPop{position:absolute;top:calc(100% + 6px);left:8px;width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:12px;z-index:30;font-size:14px}
#setPop .sTop{display:flex;align-items:center;margin-bottom:4px}
#setPop .sTop b{flex:1;font-size:13px}
#setPop .sTop button{background:none;border:0;cursor:pointer;font-size:13px;padding:4px;color:var(--sub)}
#setPop h4{margin:10px 0 2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
#setPop .val{min-width:46px;text-align:center;color:var(--sub);font-size:13px}
#setPop .sec{background:#f5f5f7;border-radius:10px;padding:2px 10px;margin:2px 0 6px}
#setPop .sec .row{margin-top:6px;margin-bottom:6px}
#setPop .sec input{background:#fff}
#setPop .step{background:#fff;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600}
#setPop img.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e8e8ed;flex:none}
#tplPop{position:absolute;top:calc(100% + 6px);left:8px;width:280px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:8px;z-index:30}
#tplPop button{display:block;width:100%;height:auto;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
#tplPop button:hover{background:rgba(0,0,0,.05)}
#tplPop .use{display:block;font-weight:600;font-size:13.5px}
#tplPop .ins{display:block;font-size:12px;color:var(--sub);font-weight:400}
#tplPop{max-width:calc(100vw - 32px)}
#histPop{position:absolute;top:calc(100% + 6px);left:8px;width:340px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:8px;z-index:30;font-size:13px}
#histPop .srow{display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:8px}
#histPop .srow:hover{background:rgba(0,0,0,.04)}
#histPop .srow .t{flex:1;min-width:0;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#histPop .srow button{background:#f5f5f7;border:0;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
#histPop pre.diff{margin:4px 8px 8px;padding:8px 10px;background:#1c1c1e;color:#e5e5ea;border-radius:8px;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
#histPop pre.diff .a{color:#ff9d9d}#histPop pre.diff .b{color:#9df0b8}
#histPop .save{display:flex;align-items:center;width:100%;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;margin-bottom:4px;text-align:left}
.mbox{position:absolute;top:100%;left:0;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20}
.mbox button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--text)}
.mbox button:hover{background:var(--sel)}
#symPop{position:absolute;top:calc(100% + 6px);left:8px;width:300px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:8px;z-index:30}
#symPop input{width:100%;box-sizing:border-box;background:#f5f5f7;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px}
#symPop .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:220px;overflow:auto}
#symPop .grid button{background:none;border:0;border-radius:7px;padding:6px 0;cursor:pointer;font-size:16px}
#symPop .grid button:hover{background:var(--sel)}
#tplPop .trow{display:flex;gap:4px}

async function errDiags() { // Compile-Fehler für Semantik (Syntax kommt schneller aus dem Lint)

function paintErr() { // ein Mark + eine Meldung je Zeile, Lint-Text zuerst (gut), Compile füllt auf

  forEachDiagnostic(cm.state, (d, from) => { // Lint: schnell, gute Texte, wandert schon gemappt mit
    const l = cm.state.doc.lineAt(from).number

function lineDiff(a, b) { // LCS auf Zeilen (Caps s. oben), Ausgabe max DIFF_OUT Zeilen
  const A = a.split('\n').slice(0, DIFF_MAX), B = b.split('\n').slice(0, DIFF_MAX)
  const cut = A.length === DIFF_MAX || B.length === DIFF_MAX
  const n = A.length, m = B.length
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0))
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1])
  const out = []
  let i = 0, j = 0
  while (i < n && j < m) {
    if (A[i] === B[j]) { i++; j++ }
    else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['a', A[i++]])
    else out.push(['b', B[j++]])
  }
  while (i < n) out.push(['a', A[i++]])
  while (j < m) out.push(['b', B[j++]])
  if (cut || out.length > DIFF_OUT) out.push([' ', '… (gekürzt)'])
  return out.slice(0, DIFF_OUT + 1)
}
async function showDiff(sid, row) {

function wireMentions(inp) {
  let box = null
  const close = () => { if (box) { box.remove(); box = null } }
  inp.addEventListener('input', () => {
    close()
    const m = inp.value.slice(0, inp.selectionStart).match(/@([\w-]*)$/)
    if (!m) return
    const q = m[1].toLowerCase()
    const list = members.filter(n => n.toLowerCase().startsWith(q) && n !== user).slice(0, 5)
    if (!list.length) return
    box = el('div', 'mbox')
    list.forEach(n => {
      const b = el('button', null, '@' + n)
      b.onmousedown = e => {
        e.preventDefault()
        const s = inp.selectionStart
        inp.value = inp.value.slice(0, s).replace(/@[\w-]*$/, '@' + n + ' ') + inp.value.slice(s)
        inp.focus(); close()
      }
      box.appendChild(b)
    })
    inp.parentNode.style.position = 'relative'
    inp.parentNode.appendChild(box)
  })
  inp.addEventListener('blur', () => setTimeout(close, 200))
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') close() })
}

let syncOn = true, syncT = 0, syncPage = 0, pvT = 0 // Klick-Sync Editor<->Preview, letzte Treffer-Seite
function queueSyncPv() { clearTimeout(syncT); syncT = setTimeout(syncToPv, SYNC_MS) }
function syncToPv() { // Editor -> Preview: Seite mit den meisten Zeilen-Worten, Treffer mittig
  if (!syncOn || !docId || tplName || activeFile || Date.now() - pvT < 1000) return // Preview-Klick: Papier bleibt fest
  const pv = $('preview')
  if (!pv.scrollHeight || document.body.classList.contains('editonly')) return
  const total = cm.state.doc.lines || 1
  const line = cm.state.doc.lineAt(cm.state.selection.main.head).number
  // Zeile normalisieren: trim, Markup grob weg, nur lange Worte zaehlen
  const ank = cm.state.doc.line(line).text.trim().replace(/^[=+\-*#>]+/, '').replace(/[#*`_$[\](){}<>\/\\|=]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase()
  const words = [...new Set(ank.split(' ').filter(w => w.length >= 4))].slice(0, 6)
  const n = pvTexts.length
  if (words.length && n) {
    let bi = -1, bs = 0 // beste Seite: meiste Treffer, Gleichstand bleibt auf syncPage
    for (let pi = 0; pi < n; pi++) {
      const items = pvTexts[pi] || []
      let s = 0
      for (const w of words) for (const it of items) {
        if (it.s && it.s.toLowerCase().includes(w)) { s++; break }
      }
      if (s > bs || (s === bs && pi === syncPage)) { bs = s; bi = pi }
    }
    if (bi >= 0 && bs > 0) { // mind. ein Wort: sonst Fallback (kein Zufalls-Sprung)
      const items = pvTexts[bi] || []
      const long = words.slice().sort((a, b) => b.length - a.length)[0]
      for (const it of items) {
        if (it.s && it.s.toLowerCase().includes(long)) {
          const cv = pv.querySelectorAll('canvas')[bi]
          if (!cv) break
          const pr = pv.getBoundingClientRect(), cr = cv.getBoundingClientRect()
          const want = pv.scrollTop + (cr.top - pr.top) + it.y * (cr.width / cv.width) - pv.clientHeight / 2
          syncPage = bi
          if (Math.abs(want - pv.scrollTop) > SYNC_PX) pv.scrollTop = want // Ruhe: kein Flackern
          return
        }
      }
    }
  }
  const want = (line - 1) / total * (pv.scrollHeight - pv.clientHeight) // Fallback: alte Anteil-Logik
  if (Math.abs(want - pv.scrollTop) > SYNC_PX) pv.scrollTop = want
}
function locateNear(t, s, hint) { // kürzester Treffer um die Hinweis-Zeile (auch kurze Zellen-Texte)
  s = (s || '').trim()
  if (s.length < 2) return -1
  const hp = posOfLine(t, hint)
  let best = -1, bd = 1e12, p = -1, n = 0
  while ((p = t.indexOf(s, p + 1)) >= 0 && n++ < 50) {
    const dd = Math.abs(p - hp)
    if (dd < bd) { bd = dd; best = p }
  }
  return best
}
function jumpPos(pos) { // Editor-Sprung in die Bildschirmmitte (Preview scrollt nicht nach)
  pvT = Date.now()

}
$('preview').addEventListener('click', e => { // Preview -> Editor: Text-Anker zuerst (Tabellen!), sonst Anteil
  if (!syncOn || !docId || tplName || activeFile) return
  const pv = $('preview')
  const cv = e.target.closest ? e.target.closest('canvas') : null
  if (cv && pvTexts.length) {
    const pi = [...pv.querySelectorAll('canvas')].indexOf(cv) // nur Canvas zaehlen, .empty-Divs ignorieren
    const items = pvTexts[pi] || []
    const r = cv.getBoundingClientRect(), sx = cv.width / r.width, sy = cv.height / r.height // Canvas-px: Backing passt zu pvTexts
    const x = (e.clientX - r.left) * sx, y = (e.clientY - r.top) * sy
    let best = null, bd = CLICK_PX * CLICK_PX
    for (const it of items) {
      if (!it.s.trim()) continue
      const dx = it.x - x, dy = it.y - y, dd = dx * dx + dy * dy
      if (dd < bd) { bd = dd; best = it }
    }
    if (best) {
      const total = cm.state.doc.lines || 1
      let all = 0 // Hinweis aus Textmenge (statt Klick-Hoehe): Treffer-Anteil * Zeilen
      for (const arr of pvTexts) all += arr.length
      let before = 0
      for (let k = 0; k < pi; k++) before += (pvTexts[k] || []).length
      const hint = Math.max(1, Math.min(total, Math.round((before + items.indexOf(best)) / Math.max(1, all) * total) + 1))
      const at = locateNear(getT(), best.s, hint)
      if (at >= 0) {
        const um = getT().slice(Math.max(0, at - 80), at + 80) // Treffer pruefen: Umgebung muss Klick-Wort enthalten
        const w = (best.s.trim().split(/\s+/).sort((a, b) => b.length - a.length)[0] || '')
        if (w.length < 4 || um.includes(w) || um.includes(best.s.trim())) { syncPage = pi; jumpPos(at); return }
      }
    }
    syncPage = pi // auch ohne Treffer: naechster Sync startet auf Klick-Seite
  }
  const r = pv.getBoundingClientRect() // Fallback: Anteil (Bilder, Ränder, Formeln ohne Text)
  const ratio = Math.max(0, Math.min(1, (e.clientY - r.top + pv.scrollTop) / pv.scrollHeight))
  const lines = getT().split('\n'), total = lines.length || 1
  let line = Math.max(1, Math.min(total, Math.round(ratio * total) + 1))
  while (line > 1 && !lines[line - 1].trim()) line-- // auf Absatz-Anfang einrasten
  jumpPos(posOfLine(getT(), line))
})

// --- Login / Buttons ---
function paintMe() { // eigener Blob in UserBox (Bild statt Farbe, fehlt = Farbe)
  $('meDot').style.background = avBg(user || '?', colOf(user || '?'))
  $('meDot').title = 'you - ' + (user || '?')
}
let avatarV = 0
const avBg = (n, c) => `${c} url("/api/avatar/${encodeURIComponent(n)}?v=${avatarV}") center/cover`
let regMode = false
$('mode').onclick = e => {
  e.preventDefault(); regMode = !regMode
  $('go').textContent = regMode ? 'Registrieren' : 'Anmelden'
  $('mode').textContent = regMode ? 'Schon dabei? Anmelden' : 'Noch kein Konto? Registrieren'
  $('err').textContent = ''
}
async function login(u, p) {
  const d = await api('POST', regMode ? '/api/register' : '/api/login', { username: u, password: p })
  token = d.token; user = d.user
  localStorage.setItem('typst_token', token)
  $('login').style.display = 'none'; $('app').classList.add('on')
  cm.measure() // Konstruktion lief versteckt (Login): Maße jetzt sync neu, sonst Cursor/Klicks daneben
  $('who').textContent = user
  paintMe()
  sidebar(); loadTpl(); checkJoin()
}
$('login').onsubmit = e => { e.preventDefault(); login($('u').value, $('p').value).catch(err => $('err').textContent = err.message) }
$('out').onclick = () => api('POST', '/api/logout').finally(() => {
  localStorage.removeItem('typst_token'); location.reload()
})
$('renBtn').onclick = async () => { // Stift hinter Titel (Owner only, Vorlage auch)
  if (tplName) { // Vorlage: neu speichern + alt löschen (Upsert täte sonst überschreiben)
    const t = await ask('Vorlage umbenennen', { value: tplName })
    if (t === null || !t.trim() || t.trim() === tplName) return
    await loadTpl() // frisch: sonst übersieht der Schutz fremd angelegte Namen
    if (myTpl.some(x => x.name === t.trim())) { alert('Name gibt es schon'); return }
    try {
      const old = myTpl.find(x => x.name === tplName)
      const r = await api('POST', '/api/templates', { name: t.trim(), content: getT(), folder: old && old.folder ? old.folder : '' })
      await api('DELETE', '/api/templates/' + encodeURIComponent(tplName))
      tplName = r.name; $('title').textContent = r.name
      await loadTpl(); renderTpl(); sidebar()
    } catch (e) { alert(e.message) }
    return
  }
  if (!docId || docRole !== 'owner') return
  const t = await ask('Dokument umbenennen', { value: $('title').textContent })
  if (t === null || !t.trim()) return
  api('POST', `/api/docs/${docId}/rename`, { title: t.trim() })
    .then(() => { $('title').textContent = t.trim(); sidebar() })
    .catch(e => alert(e.message))
}
$('new').onclick = async () => {
  const t = await ask('Neues Dokument', { value: 'Neues Dokument', ph: 'Titel' })
  if (t === null) return
  const opts = [['Ohne Ordner', 'Oben in der Liste'],
    ...folders.map(f => [f.folder, f.n + (f.n === 1 ? ' Dokument' : ' Dokumente')]),
    ['+ Neuer Ordner', 'Name danach eingeben']]
  const fi = await askPick('Ordner wählen', opts)
  if (fi < 0) return
  let folder = fi > 0 && fi <= folders.length ? folders[fi - 1].folder : ''
  if (fi === opts.length - 1) {
    const n = await ask('Neuer Ordner', { ph: 'Name' })
    if (n === null) return
    folder = (n || '').trim()
  }
  const p = await askPick('Vorlage wählen', [['Leer', 'Leeres Blatt zum Selbstgestalten'], ['Bericht', 'A4 mit Titel, Nummerierung und Einleitung'], ['Folien', 'Breitbild-Folien mit zwei Beispiel-Seiten']])
  if (p < 0) return
  try { openDoc((await api('POST', '/api/docs/create', { title: t, content: STARTERS[p], folder })).id) }
  catch (e) { alert(e.message) }
}
let upBusy = false // Doppelklick: kein zweites Doc
$('upDoc').onclick = () => $('docPick').click()
$('docPick').onchange = async () => { // .typ als normales Doc (nicht Vorlage): Titel aus Dateiname
  const f = $('docPick').files[0]; $('docPick').value = ''
  if (!f || upBusy) return
  if (!/\.typ$/i.test(f.name)) { alert('Nur .typ'); return }
  if (f.size > 200 * 1024) { alert('Max 200 KB'); return }
  upBusy = true
  try {
    const txt = await f.text()
    if (!txt.trim()) { alert('Leere Datei'); return }
    if (txt.length > 200 * 1024) { alert('Max 200 KB'); return }
    const t = f.name.replace(/\.typ$/i, '').replace(/\s+/g, ' ').trim().slice(0, 100) || 'Neues Dokument'
    openDoc((await api('POST', '/api/docs/create', { title: t, content: txt })).id)
  } catch (e) { alert(e.message) } finally { upBusy = false }
}
$('del').onclick = async () => {
  if (tplName) { // offene Vorlage löschen
    if (!await ask(`Vorlage „${tplName}“ löschen?`, { noInput: true, ok: 'Löschen', danger: true })) return
    try { await api('DELETE', '/api/templates/' + encodeURIComponent(tplName)) }
    catch (e) { alert(e.message); return }
    tplName = ''
    $('del').style.display = 'none'; $('dlTyp').style.display = 'none'; $('tplBtn').style.display = 'none'
    $('symBtn').style.display = 'none'; $('colPick').style.display = 'none'; $('renBtn').style.display = 'none'
    $('viewSeg').style.display = '' // Segment zurück: kein Doc, aber Ansicht wählbar
    $('title').textContent = 'Kein Dokument'; $('role').textContent = ''
    paintEmpty()
    setT(''); gutter(); paintOutline(); await loadTpl(); sidebar()
    return
  }
  if (openedTrashed) {
    if (!await ask('Endgültig löschen? Weg ist weg.', { noInput: true, ok: 'Löschen', danger: true })) return
  } else if (!await ask('In den Papierkorb verschieben?', { noInput: true, ok: 'OK' })) return
  api('DELETE', `/api/docs/${docId}`).then(() => { closeView(); sidebar() })
}
setInterval(() => { if (docId) loadComments().catch(() => {}) }, POLL_MS)
addEventListener('pagehide', () => { // letzte Edits mitnehmen, falls der 2s-Save noch aussteht
  if ($('save').textContent !== '…') return
  const head = { 'Content-Type': 'application/json' }
  if (tplName)
    fetch('/api/templates', { method: 'POST', headers: head,
      body: JSON.stringify({ name: tplName, content: getT() }), keepalive: true })
  else if (docId && activeFile)
    fetch(`/api/docs/${docId}/files/${encodeURIComponent(activeFile)}/text`, { method: 'POST', headers: head,
      body: JSON.stringify({ content: getT() }), keepalive: true })
  else if (docId && ytext && synced && docRole !== 'reviewer')
    fetch(`/api/docs/${docId}/save`, { method: 'POST', headers: head,
      body: JSON.stringify({ content: ytext.toString() }), keepalive: true })
})

if (token) api('GET', '/api/me').then(d => {
  user = d.user
  $('login').style.display = 'none'; $('app').classList.add('on')
  cm.measure() // s.o.: versteckt konstruiert -> sync neu vermessen
  $('who').textContent = user
  paintMe()
  sidebar(); loadTpl(); checkJoin()
}).catch(() => localStorage.removeItem('typst_token'))
try { (window.requestIdleCallback || (fn => setTimeout(fn, 1500)))(() => ensureTypst().catch(() => {})) } catch (e) {} // Compiler warm im Leerlauf: UI malt zuerst
document.getElementById('booterr')?.remove() // Modul läuft: Boot-Fehlerbox weg
</script>
</body>
</html>
