services:
  app:
    image: ghcr.io/fl-grtg/typst-editor:v0.1.0
    container_name: typst-editor
    pull_policy: always
    env_file: [{path: .env, required: false}]
    environment:
      DATA_DIR: /app/data
      # PORT comes from .env via ${PORT} below (default 8978). Do not pin here: it would override .env.
    volumes:
      - ${COMPOSE_DATA_PATH:-typst-data}:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      replicas: 1 # rooms live in process memory (sync.py): more replicas would split sessions.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8978')+'/healthz', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "999:999" # app user from the start: no root, no extra caps needed.
    read_only: true # uploads spill to /tmp (tmpfs below), data lives on the mounted volume.
    tmpfs: [/tmp, /run]
    cap_drop: [ALL]
    pids_limit: 100
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    ports:
      - "127.0.0.1:${PORT:-8978}:${PORT:-8978}"

volumes:
  typst-data:
