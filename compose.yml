services:
  app:
    image: ghcr.io/fl-grtg/typst-editor:main
    build: .
    env_file: [{path: .env, required: false}]
    environment:
      DATA_DIR: /app/data
      PORT: "8978"
    volumes:
      - ${COMPOSE_DATA_PATH:-./data}:/app/data
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8978')+'/healthz', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "999:999"
    cap_drop: [ALL]
    pids_limit: 100
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    ports:
      - "127.0.0.1:8978:8978"
