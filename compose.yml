services:
  app:
    image: ghcr.io/fl-grtg/typst-editor:main
    container_name: typst-editor
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: 8978
    ports:
      - "8978:8978"
    volumes:
      - typst-data:/app/data

volumes:
  typst-data:
