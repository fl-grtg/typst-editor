repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--, backend/, scripts/, tests/]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [backend/, scripts/, tests/]
        additional_dependencies: [fastapi, uvicorn, websockets, pycrdt, python-multipart]
