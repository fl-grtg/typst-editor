name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. image tag or git SHA
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome / Chromium, Firefox, Safari, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      render: text
