name: ci
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip check
      - run: pytest -q
      - run: python scripts/backup.py --dry-run
      - run: python web/build.py --check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check backend/ scripts/ tests/ e2e/
      - run: mypy backend/ scripts/ tests/ e2e/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # No pip hash-lock: risky (rotating wheels); `pip check` is enough as a consistency gate.
      # No coverage gate and no image-scan gate: informational only, never fails the build (flaky/slow).
      - run: |
          # Docker Hub rate-limits shared runner IPs (429 toomanyrequests);
          # retry with backoff instead of failing the whole CI on infra flakes.
          for i in 1 2 3 4 5; do
            docker build --pull -t typst-editor . && break
            echo "docker build attempt $i failed, retrying in 60s..."
            sleep 60
          done
          docker image inspect typst-editor >/dev/null
      - run: |
          docker run -d --rm -p 8978:8978 --name smoke typst-editor
          trap 'docker stop smoke || true' EXIT
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:8978/healthz; then ok=1; break; fi
            sleep 3
          done
          curl -f --max-time 5 http://127.0.0.1:8978/healthz
          test "$ok" = "1"
  vendor-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cm-build/package-lock.json
      - run: npm ci
        working-directory: cm-build
      - run: npm run build
        working-directory: cm-build
      - run: git diff --exit-code vendor-cm.js
      - run: |
          sz=$(stat -c%s vendor-cm.js)
          echo "vendor-cm.js $sz bytes (budget 614400)"
          test "$sz" -le 614400
  e2e:
    # Browser smoke tests. Informational until the first green runs are confirmed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-e2e.txt
      - run: playwright install --with-deps chromium
      - run: pytest e2e -q
