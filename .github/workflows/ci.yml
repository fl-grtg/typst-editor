name: ci
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip check
      - name: Install Typst 0.15.1
        run: |
          curl -fsSL --retry 3 -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - run: pytest -q
        env:
          REQUIRE_TYPST: "1"
      - run: python scripts/backup.py --dry-run
      - run: python web/build.py --check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check backend/ scripts/ tests/ e2e/
      - run: mypy backend/ scripts/ tests/ e2e/
      - run: python web/check_i18n.py
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # No pip hash-lock: risky (rotating wheels); `pip check` is enough as a consistency gate.
      # No coverage gate and no image-scan gate: informational only, never fails the build (flaky/slow).
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.prerelease.yml config --quiet
          docker compose -f compose.yml -f compose.hardened.yml config --quiet
      - run: |
          # Docker Hub rate-limits shared runner IPs (429 toomanyrequests);
          # retry with backoff instead of failing the whole CI on infra flakes.
          for i in 1 2 3 4 5; do
            docker build --pull -t ghcr.io/fl-grtg/typst-editor:main . && break
            echo "docker build attempt $i failed, retrying in 60s..."
            sleep 60
          done
          docker image inspect ghcr.io/fl-grtg/typst-editor:main >/dev/null
      - run: |
          trap 'docker compose down -v || true' EXIT
          docker compose up -d --pull never
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:8978/healthz; then ok=1; break; fi
            sleep 3
          done
          curl -f --max-time 5 http://127.0.0.1:8978/healthz
          test "$ok" = "1"
  vendor-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cm-build/package-lock.json
      - run: npm ci
        working-directory: cm-build
      - run: npm run build
        working-directory: cm-build
      - run: node --test tests/js/*.cjs
      - run: git diff --exit-code vendor-cm.js
      - run: |
          sz=$(stat -c%s vendor-cm.js)
          echo "vendor-cm.js $sz bytes (budget 716800)"
          test "$sz" -le 716800
  e2e:
    # Browser regressions are required for a release candidate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-e2e.txt
      - run: playwright install --with-deps chromium
      - name: Install Typst 0.15.1
        run: |
          curl -fsSL --retry 3 -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - run: pytest e2e -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: test-results/
          if-no-files-found: ignore
