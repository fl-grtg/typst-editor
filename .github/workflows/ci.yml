name: ci
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip check
      - run: pytest -q
      - run: python scripts/backup.py --dry-run
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check backend/ scripts/ tests/
      - run: mypy backend/ scripts/ tests/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Kein pip hash-lock: riskant (rotierende Wheels), pip check reicht als Konsistenz-Gate.
      # Kein coverage-gate und kein Image-Scan-Gate: nur Hinweis, kein Fail (flaky/slow).
      - run: docker build --pull -t typst-editor .
      - run: |
          docker run -d --rm -p 8978:8978 --name smoke typst-editor
          trap 'docker stop smoke || true' EXIT
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:8978/healthz; then ok=1; break; fi
            sleep 3
          done
          curl -f --max-time 5 http://127.0.0.1:8978/healthz
          test "$ok" = "1"
  vendor-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cm-build/package-lock.json
      - run: npm ci
        working-directory: cm-build
      - run: npm run build
        working-directory: cm-build
      - run: git diff --exit-code vendor-cm.js
      - run: |
          sz=$(stat -c%s vendor-cm.js)
          echo "vendor-cm.js $sz bytes (budget 614400)"
          test "$sz" -le 614400
